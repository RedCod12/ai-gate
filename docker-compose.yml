services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gate
      POSTGRES_PASSWORD: gate
      POSTGRES_DB: aigate
    ports:
      - "55432:5432"
    volumes:
      - gate_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gate -d aigate"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  gate_pg:
